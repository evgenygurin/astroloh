services:
  # Backend service с упрощенным Dockerfile
  backend:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        BUILDKIT_INLINE_CACHE: 1
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://astroloh_user:astroloh_password@db:5432/astroloh_db
      - SECRET_KEY=test_secret_key
      - ENCRYPTION_KEY=test_encryption_key
      - KERYKEION_ENABLED=false
      - SWISSEPH_ENABLED=false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - astroloh-network
    restart: unless-stopped

  # Database service
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: astroloh_user
      POSTGRES_PASSWORD: astroloh_password
      POSTGRES_DB: astroloh_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_database.sql:/docker-entrypoint-initdb.d/01_init_database.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astroloh_user -d astroloh_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - astroloh-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  astroloh-network:
    driver: bridge