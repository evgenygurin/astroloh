[build]
  command = "pip install --upgrade pip wheel setuptools && pip install --only-binary=:all: --prefer-binary --no-compile -r requirements.txt"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"
  PIP_ONLY_BINARY = ":all:"
  PIP_NO_COMPILE = "1"
  PIP_PREFER_BINARY = "1"

[functions]
  directory = "netlify/functions"

# Redirect all API calls to the FastAPI app
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/app/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200